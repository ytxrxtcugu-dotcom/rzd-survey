workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Debug -derivedDataPath build CODE_SIGNING_IDENTITY="-" CODE_SIGNING_REQUIRED=NO
    artifacts:
      - ios/App/build/Build/Products/Debug-iphoneos/*.app